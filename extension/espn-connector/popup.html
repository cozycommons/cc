<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, system-ui, sans-serif; width: 320px; margin: 0; padding: 14px 16px; color: #2b2118; background: #fdf8f1; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { font-size: 12.5px; line-height: 1.45; margin: 6px 0; color: #5c4f42; }
  label { display: block; font-size: 12px; margin-top: 10px; color: #5c4f42; }
  input[type="text"], input[type="number"] { width: 100%; box-sizing: border-box; margin-top: 3px; padding: 7px 8px; border: 1px solid #d6c5a7; border-radius: 8px; font: inherit; font-size: 13px; background: #fff; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; margin-top: 12px; color: #2b2118; }
  button { width: 100%; margin-top: 14px; padding: 10px; border: 0; border-radius: 9px; background: #b75f41; color: #fff; font: inherit; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { font-size: 12.5px; margin-top: 10px; white-space: pre-wrap; word-break: break-word; }
  #token { font-family: ui-monospace, monospace; font-size: 11.5px; background: #fff; border: 1px dashed #b75f41; border-radius: 8px; padding: 8px; margin-top: 8px; word-break: break-all; display: none; }
  #copy { background: #2e7d32; margin-top: 8px; }
  .ok { color: #2e7d32; }
  .err { color: #b3261e; }
</style>
</head>
<body>
  <h1>Connect ESPN to Cozy Commons</h1>
  <p>Reads your ESPN session cookies from this browser and sends them to Cozy Commons. Your password is never touched.</p>
  <p id="found">Checking ESPN cookies…</p>
  <div class="row">
    <div>
      <label for="league">League ID</label>
      <input type="number" id="league" value="1709148631">
    </div>
    <div>
      <label for="season">Season</label>
      <input type="number" id="season" value="2027">
    </div>
  </div>
  <label for="label">Label</label>
  <input type="text" id="label" value="ext-prototype">
  <label class="check"><input type="checkbox" id="automation" checked> Enable automatic lineups after connecting</label>
  <button id="connect" disabled>Connect</button>
  <div id="status"></div>
  <div id="token"></div>
  <button id="copy" style="display:none">Copy token</button>
  <details style="margin-top:12px">
    <summary style="font-size:12px; color:#5c4f42; cursor:pointer">Diagnostics (cookie names only)</summary>
    <pre id="diagpre" style="font-size:10.5px; white-space:pre-wrap; word-break:break-word; background:#fff; border:1px solid #e3d5bd; border-radius:8px; padding:8px; margin-top:6px">running…</pre>
  </details>
  <p style="font-size:11px; color:#8a7a68; margin-top:10px">Cozy Commons ESPN Connector · prototype v0.1.3</p>
  <script src="popup.js"></script>
</body>
</html>
