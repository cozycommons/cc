name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build:check
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      - name: Build frontend container
        run: >-
          docker build
          --tag cozy-commons-frontend-ci
          -f Dockerfile
          --build-arg VITE_API_URL=http://127.0.0.1:8000
          --build-arg VITE_SUPABASE_URL=http://127.0.0.1:54321
          --build-arg VITE_SUPABASE_ANON_KEY=sb_publishable_ci_placeholder
          ..
      - name: Smoke test frontend container
        run: |
          set -euo pipefail
          container=cozy-commons-frontend-ci
          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              docker logs "$container" || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" --publish 8080:8080 \
            --env PORT=8080 cozy-commons-frontend-ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/dice >/dev/null
          curl --fail --silent --show-error --max-time 2 \
            http://127.0.0.1:8080/commons/cozy-commons-room-tile-base.png >/dev/null

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - run: backend/.venv/bin/python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
      - run: scripts/check-dice-migration-contract.sh
      - run: scripts/check-commons-migration-contract.sh
      - run: scripts/test-supabase-db-url.sh
      - run: scripts/test-commons-migrations.sh
      - run: scripts/test-backend-predeployment.sh
      - name: Build backend container
        run: docker build --tag cozy-commons-backend-ci -f backend/Dockerfile .
      - name: Smoke test backend container
        run: |
          set -euo pipefail
          container=cozy-commons-backend-ci
          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              docker logs "$container" || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" --publish 8000:8000 \
            --env DICE_LOCAL_HARNESS=true \
            --env SUPABASE_URL=http://127.0.0.1:54321 \
            --env SUPABASE_SERVICE_KEY=synthetic-ci-service-key \
            cozy-commons-backend-ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8000/health >/dev/null

          for attempt in $(seq 1 30); do
            health_status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$health_status" = healthy ]; then
              break
            fi
            if [ "$health_status" = unhealthy ]; then
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy

          ready_status=$(curl --silent --show-error --max-time 5 --output /tmp/backend-ready.json \
            --write-out '%{http_code}' http://127.0.0.1:8000/ready)
          test "$ready_status" = 503
          grep --fixed-strings '"status":"not_ready"' /tmp/backend-ready.json
      - name: Verify backend pre-deployment payload
        run: >-
          docker run --rm cozy-commons-backend-ci sh -c
          'test -x /app/apply-shared-migrations.sh &&
          test -x /app/apply-commons-migrations.sh &&
          test -f /app/shared/commons/scene-contract-v1.json && command -v psql'
