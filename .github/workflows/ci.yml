name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

jobs:
  trips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - name: Start isolated Supabase Auth and Trips database
        run: backend/.venv/bin/python scripts/trips-dev.py setup
      - name: Require real Supabase Trips integration tests
        run: backend/.venv/bin/python -m pytest backend/tests/test_trips.py backend/tests/test_trips_import.py backend/tests/test_trips_profiles.py -q
        env:
          PYTHONPATH: backend
          TRIPS_INTEGRATION: "1"

  crowdset:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-crowdset.txt
      - name: Install media inspection tools
        timeout-minutes: 3
        run: |
          . /etc/os-release
          cat > /tmp/crowdset-apt.sources <<EOF
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          options=(-o Dir::Etc::sourcelist=/tmp/crowdset-apt.sources -o Dir::Etc::sourceparts=-
                   -o Acquire::https::Timeout=30 -o Acquire::Retries=1)
          sudo apt-get "${options[@]}" update
          sudo apt-get "${options[@]}" install -y --no-install-recommends ffmpeg
      - run: bash scripts/crowdset-dev.sh setup
      - run: .crowdset-venv/bin/python -m pip install pytest==8.3.4 httpx==0.28.1
      - run: .crowdset-venv/bin/python -m pytest backend/crowdset/tests -q
        env:
          PYTHONPATH: backend

  crowdset-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Crowdset container
        run: >-
          docker build --tag crowdset-ci -f backend/crowdset/Dockerfile
          --build-arg VITE_API_URL=http://127.0.0.1:8000
          --build-arg VITE_SUPABASE_URL=http://127.0.0.1:54321
          --build-arg VITE_SUPABASE_ANON_KEY=sb_publishable_ci_placeholder .
      - name: Verify hosted container
        run: |
          set -euo pipefail
          trap 'docker logs crowdset-ci; docker rm --force crowdset-ci' EXIT
          docker run --detach --name crowdset-ci --publish 127.0.0.1:8010:8010 \
            --env CROWDSET_ORIGIN=https://crowdset.example \
            --env CROWDSET_AUTH_URL=https://example.supabase.co \
            --env CROWDSET_AUTH_KEY=sb_publishable_ci_placeholder \
            --mount type=volume,destination=/data crowdset-ci
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors --max-time 5 \
            --header 'Host: crowdset.example' http://127.0.0.1:8010/crowdset/health
          curl --fail --header 'Host: crowdset.example' http://127.0.0.1:8010/crowdset
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: crowdset.example' http://127.0.0.1:8010/crowdset/sets)" = 401
          docker exec crowdset-ci test -w /data
          docker exec crowdset-ci python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_version())'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build:check
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      - name: Build frontend container
        run: >-
          docker build
          --tag cozy-commons-frontend-ci
          -f Dockerfile
          --build-arg VITE_API_URL=http://127.0.0.1:8000
          --build-arg VITE_SUPABASE_URL=http://127.0.0.1:54321
          --build-arg VITE_SUPABASE_ANON_KEY=sb_publishable_ci_placeholder
          ..
      - name: Smoke test frontend container
        run: |
          set -euo pipefail
          container=cozy-commons-frontend-ci
          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              docker logs "$container" || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" --publish 8080:8080 \
            --env PORT=8080 cozy-commons-frontend-ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/dice >/dev/null
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/trips >/dev/null
          curl --fail --silent --show-error --max-time 2 \
            http://127.0.0.1:8080/trips/10000000-0000-0000-0000-000000000001 >/dev/null
          curl --fail --silent --show-error --max-time 2 \
            http://127.0.0.1:8080/trips/join/10000000-0000-0000-0000-000000000001 >/dev/null
          # Document routes must revalidate so a deploy cannot leave navigation
          # or lazy bundle references stuck on a previous release.
          for route in / /index.html /dice /trips \
            /trips/10000000-0000-0000-0000-000000000001 \
            /trips/join/10000000-0000-0000-0000-000000000001; do
            curl --fail --silent --show-error --head --max-time 2 "http://127.0.0.1:8080$route" \
              | tr -d '\r' | grep -qi '^Cache-Control: no-cache$'
          done
          curl --fail --silent --show-error --max-time 2 --location \
            http://127.0.0.1:8080/design >/dev/null
          curl --fail --silent --show-error --max-time 2 \
            http://127.0.0.1:8080/design/cozy-clay/components.html >/dev/null
          curl --fail --silent --show-error --max-time 2 \
            http://127.0.0.1:8080/design/dice >/dev/null
          curl --fail --silent --show-error --max-time 2 \
            http://127.0.0.1:8080/commons/cozy-commons-room-tile-base.png >/dev/null

  backend:
    # main requires this existing check name. Its success must also require
    # the real Supabase Trips integration job, rather than merely an optional job.
    needs: trips
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql://postgres:postgres@localhost:5432/dummi_test
      DICE_REQUIRE_DATABASE_TESTS: "1"
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dummi_test
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d dummi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Require successful Trips integration
        run: test '${{ needs.trips.result }}' = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - name: Bootstrap isolated database
        run: bash scripts/bootstrap-dice-test-db.sh
      - name: Start real PostgREST
        run: |
          docker run -d --name dice-ci-rest --network host \
            -e PGRST_DB_URI=postgresql://postgres:postgres@localhost:5432/dummi_test \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_SERVER_PORT=55433 \
            -e PGRST_JWT_SECRET=local-dice-test-jwt-secret-at-least-32-characters \
            postgrest/postgrest:v14.14
          python3 scripts/ci-rest-proxy.py > /tmp/dice-ci-rest.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:55431/rest/v1/ > /dev/null
          echo 'API_URL=http://127.0.0.1:55431' >> "$GITHUB_ENV"
          echo 'DICE_TEST_REST_URL=http://127.0.0.1:55431' >> "$GITHUB_ENV"
          backend/.venv/bin/python -c "import jwt; print('SECRET_KEY='+jwt.encode({'role':'service_role'},'local-dice-test-jwt-secret-at-least-32-characters',algorithm='HS256'))" >> "$GITHUB_ENV"
      - run: backend/.venv/bin/python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
      - run: scripts/check-dice-migration-contract.sh
      - run: scripts/check-commons-migration-contract.sh
      - run: scripts/test-supabase-db-url.sh
      - name: Build backend container
        run: docker build --tag cozy-commons-backend-ci -f backend/Dockerfile .
      - name: Exercise incoming release and maintenance
        run: |
          set -euo pipefail
          # Reset only this job's disposable service database. The incoming
          # image must apply all migrations, starting from Supabase's scaffold.
          docker stop dice-ci-rest
          dropdb -h localhost -U postgres --force dummi_test
          createdb -h localhost -U postgres dummi_test
          psql "$DB_URL" -v ON_ERROR_STOP=1 --file scripts/supabase-test-scaffold.sql
          docker start dice-ci-rest
          container=cozy-commons-backend-ci
          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              docker logs "$container" || true
              docker logs dice-ci-rest || true
              cat /tmp/dice-ci-rest.log || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" --network host \
            --env SUPABASE_DB_URL="$DB_URL" \
            --env SUPABASE_URL=http://127.0.0.1:55431 \
            --env SUPABASE_SERVICE_KEY="$SECRET_KEY" \
            cozy-commons-backend-ci

          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors --max-time 5 http://127.0.0.1:8000/ready
          test "$(psql "$DB_URL" -Atc 'select max(version) from dice_schema_migrations')" = 80
          test "$(psql "$DB_URL" -Atc 'select max(version) from commons_schema_migrations')" = 12
          test "$(psql "$DB_URL" -Atc 'select max(version) from trips_schema_migrations')" = 2
          test "$(psql "$DB_URL" -Atc 'select trips_release_readiness()')" = t
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/trips/groups)" = 401
          docker exec "$container" python -m dice_maintenance --rebuild

          for attempt in $(seq 1 30); do
            health_status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$health_status" = healthy ]; then
              break
            fi
            if [ "$health_status" = unhealthy ]; then
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy

          docker stop dice-ci-rest
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null
          ready_status=$(curl --silent --show-error --max-time 10 --output /tmp/backend-ready.json \
            --write-out '%{http_code}' http://127.0.0.1:8000/ready)
          test "$ready_status" = 503
          grep --fixed-strings '"status":"not_ready"' /tmp/backend-ready.json
          docker rm --force "$container"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "update dice_schema_migrations set checksum='invalid' where version=80"
          if docker run --rm --network host --env SUPABASE_DB_URL="$DB_URL" cozy-commons-backend-ci; then
            echo 'Release incorrectly accepted a corrupt migration receipt' >&2
            exit 1
          fi
      - name: Verify backend release payload
        run: >-
          docker run --rm cozy-commons-backend-ci sh -c
          'test -f /app/release.py && test -f /app/migration_runner.py &&
          test -x /app/apply-shared-migrations.sh &&
          test -x /app/apply-commons-migrations.sh &&
          test -f /app/trips/migrations/0002_trips_release_readiness.sql &&
          test -f /app/shared/commons/scene-contract-v1.json && command -v psql'
