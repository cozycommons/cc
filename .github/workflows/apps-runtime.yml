name: Apps runtime prototype
on:
  pull_request:
    paths:
      - 'backend/app_runtime/**'
      - 'infra/apps/**'
      - 'scripts/apps-dev.sh'
      - '.github/workflows/apps-runtime.yml'
  merge_group:
  push:
    branches: [main]
    paths:
      - backend/app_runtime/**
      - infra/apps/**
      - scripts/apps-dev.sh
      - .github/workflows/apps-runtime.yml
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: apps-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: scripts/apps-dev.sh setup
      - run: PYTHONPATH=backend .apps-dev/venv/bin/python -m pytest backend/app_runtime/tests/test_core.py backend/app_runtime/tests/test_api.py -q
      - run: scripts/apps-dev.sh start
      - name: Wait for manager
        run: curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8091/health
      - run: scripts/apps-dev.sh smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: apps-runtime-evidence
          path: .apps-dev/smoke-result.json
          if-no-files-found: ignore
      - run: scripts/apps-dev.sh stop
        if: always()
