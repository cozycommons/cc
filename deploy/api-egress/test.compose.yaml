# Synthetic smoke only. No real credentials or shared Supabase modifications.
services:
  api:
    command: [python, /egress-probe.py, serve]
    volumes: ["${API_EGRESS_ROOT}/deploy/api-egress/probe.py:/egress-probe.py:ro", "${API_EGRESS_ROOT}/deploy/api-egress/hosts.txt:/egress-hosts.txt:ro"]
  database:
    depends_on:
      database-origin: {condition: service_healthy}
  database-origin:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: synthetic-egress-only
    tmpfs: [/var/lib/postgresql/data]
    networks:
      internet:
        aliases: [synthetic.pooler.supabase.com]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 1s
      retries: 20
