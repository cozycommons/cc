# Coolify uses the repository root as --project-directory. No checkout binds.
# TLS terminates at Caddy through a reviewed Traefik TCP passthrough router.
# Do not assign Coolify HTTPS domains or publish manager/proxy host ports.
services:
  manager:
    image: cc-apps-manager:hosted
    build:
      context: .
      dockerfile: infra/apps/Dockerfile
    command: [uvicorn, app_runtime.api:app, --host, 0.0.0.0, --port, "9000", --no-access-log]
    container_name: cc-apps-hosted-manager
    restart: unless-stopped
    stop_grace_period: 2m
    mem_limit: 512m
    pids_limit: 256
    environment:
      APPS_MODE: hosted
      APPS_DOMAIN: ${APPS_DOMAIN:?required}
      APPS_SUPABASE_URL: ${APPS_SUPABASE_URL:?required}
      APPS_SUPABASE_PUBLISHABLE_KEY: ${APPS_SUPABASE_PUBLISHABLE_KEY:?required}
      APPS_MCP_OAUTH_CLIENT_ID: ${APPS_MCP_OAUTH_CLIENT_ID:?required official Commons OAuth client UUID}
      APPS_RUNTIME_IMAGE: ${APPS_RUNTIME_IMAGE:?required}
      APPS_STATE: /state
      APPS_PROXY_CONFIG: /proxy/Caddyfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state:/state
      - proxy-config:/proxy
    networks:
      control:
        aliases: [manager]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: cc-apps-proxy:hosted
    depends_on:
      manager:
        condition: service_healthy
    build:
      context: .
      dockerfile: infra/apps/hosted/Dockerfile.proxy
    container_name: cc-apps-hosted-proxy
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    environment:
      NO_PROXY: '*'
      no_proxy: '*'
    entrypoint: [sh, -c, 'test -f /proxy/Caddyfile || cp /etc/caddy/initial /proxy/Caddyfile; exec caddy run --config /proxy/Caddyfile --adapter caddyfile']
    volumes:
      - proxy-config:/proxy
      - caddy-data:/data
      - caddy-config:/config
    networks: [control, ingress]
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=${APPS_PROXY_NETWORK:-coolify}'
      - 'traefik.tcp.routers.commons-apps.entrypoints=https'
      - 'traefik.tcp.routers.commons-apps.rule=HostSNIRegexp(`^[a-z]([a-z0-9-]{0,61}[a-z0-9])?\.cozycommons\.dev$`) && !HostSNI(`admin.cozycommons.dev`) && !HostSNI(`api.cozycommons.dev`) && !HostSNI(`auth.cozycommons.dev`) && !HostSNI(`www.cozycommons.dev`) && !HostSNI(`mail.cozycommons.dev`) && !HostSNI(`smtp.cozycommons.dev`) && !HostSNI(`ftp.cozycommons.dev`) && !HostSNI(`proxy.cozycommons.dev`) && !HostSNI(`status.cozycommons.dev`) && !HostSNI(`static.cozycommons.dev`) && !HostSNI(`assets.cozycommons.dev`) && !HostSNI(`mcp.cozycommons.dev`) && !HostSNI(`localhost.cozycommons.dev`) && !HostSNI(`default.cozycommons.dev`)'
      - 'traefik.tcp.routers.commons-apps.tls.passthrough=true'
      - 'traefik.tcp.routers.commons-apps.service=commons-apps'
      - 'traefik.tcp.services.commons-apps.loadbalancer.server.port=443'
  runtime-image:
    image: ${APPS_RUNTIME_IMAGE:?required}
    build:
      context: .
      dockerfile: infra/apps/runtime/Dockerfile
    profiles: [build]
networks:
  ingress:
    external: true
    name: ${APPS_PROXY_NETWORK:-coolify}
  control:
    name: cc-apps-hosted-control
volumes:
  state:
    name: cc-apps-hosted-state
  proxy-config:
    name: cc-apps-hosted-proxy-config

  caddy-data:
    name: cc-apps-hosted-caddy-data
  caddy-config:
    name: cc-apps-hosted-caddy-config
