<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozy room tile review</title>
  <style>
    body { margin: 0; padding: 24px; background: #151019; color: #f3e4c9; font: 15px system-ui; }
    main { max-width: 1100px; margin: auto; display: grid; grid-template-columns: minmax(320px, 760px) 260px; gap: 24px; }
    #room { aspect-ratio: 1; width: 100%; position: relative; }
    #room canvas { max-width: 100%; }
    label { display: block; margin: 16px 0 6px; }
    button, select { background: #392b38; color: inherit; border: 1px solid #816b73; padding: 8px; border-radius: 6px; }
    button { margin: 6px 4px 6px 0; cursor: pointer; }
    p { line-height: 1.5; } output { display: block; margin: 16px 0; }
    @media (max-width: 700px) { main { display: block; } body { padding: 12px; } }
  </style>
</head>
<body>
  <main>
    <div id="room" aria-label="Rendered Commons test fixture"></div>
    <aside>
        <h1>Cozy room tile review</h1>
      <p>Development fixture. These controls change only this preview.</p>
      <label for="prop">Furniture</label>
      <select id="prop">
        <option value="cozy-bed">Bed</option>
        <option value="cozy-table">Work table</option>
        <option value="cozy-chair">Chair</option>
        <option value="cozy-bookcase">Bookcase</option>
        <option value="cozy-fireplace">Fireplace</option>
        <option value="cozy-chest">Chest</option>
        <option value="cozy-plant">Plant</option>
      </select>
      <label for="orientation">View</label>
      <select id="orientation"><option value="south">South</option><option value="north">North</option></select>
      <output id="position" aria-live="polite"></output>
      <output id="viewport"></output>
      <button id="previous">Previous tile</button><button id="next">Next tile</button>
      <button id="shuffle">Shuffle entity order</button>
      <p id="result">Compare every side and corner. Furniture should stay grounded to its square footprint and sort in front of residents only when its support lies lower in the room.</p>
    </aside>
  </main>
  <script type="module" src="/src/commons/dev/review.js"></script>
</body>
</html>
