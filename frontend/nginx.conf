server {
    # Get the port from the environment variable
    listen ${PORT};

    # Listen on all network interfaces
    listen [::]:${PORT};

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Revalidate the SPA document after each deploy. Browser heuristic caching
    # otherwise keeps old navigation and references to replaced bundle hashes.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Public assets are served when the exact file exists. Directories are
        # not route targets: a directory such as /dice/ may also be a React
        # route and must fall back to the SPA entry point.
        try_files $uri /index.html;
    }

}
