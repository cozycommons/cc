server {
    # Get the port from the environment variable
    listen ${PORT};

    # Listen on all network interfaces
    listen [::]:${PORT};

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Public assets are served when the exact file exists. Directories are
        # not route targets: a directory such as /dice/ may also be a React
        # route and must fall back to the SPA entry point.
        try_files $uri /index.html;
    }

    # The design comparison board is a static reference page emitted under
    # /design. Keep the existing React Dice design route reachable by exact
    # match before the static subtree takes over.
    location = /design {
        return 302 /design/;
    }

    location = /design/dice {
        try_files $uri /index.html;
    }

    location ^~ /design/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
