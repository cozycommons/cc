server {
    # Get the port from the environment variable
    listen ${PORT};

    # Listen on all network interfaces
    listen [::]:${PORT};

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Public assets are served when the exact file exists. Directories are
        # not route targets: a directory such as /dice/ may also be a React
        # route and must fall back to the SPA entry point.
        try_files $uri /index.html;
    }

}
