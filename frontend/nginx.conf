server {
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Get the port from the environment variable
    listen ${PORT};

    # Listen on all network interfaces
    listen [::]:${PORT};

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Revalidate the SPA document after each deploy. Browser heuristic caching
    # otherwise keeps old navigation and references to replaced bundle hashes.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    # Vite content hashes change whenever a bundle changes. Missing old hashes
    # must be 404s, never an immutable copy of the SPA document.
    location ~ "^/assets/(?!(?:.*/)?(?:sw|service-worker|manifest)[.-]).+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico)$" {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed assets (including manifests and service workers) must revalidate.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Public assets are served when the exact file exists. Directories are
        # not route targets: a directory such as /dice/ may also be a React
        # route and must fall back to the SPA entry point.
        try_files $uri /index.html;
    }

}
